services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: clinica_administrativo
      POSTGRES_USER: clinica
      POSTGRES_PASSWORD: clinica123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: clinica
      RABBITMQ_DEFAULT_PASS: clinica123
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data: