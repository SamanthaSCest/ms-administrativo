services:
  # um banco por microserviço (cada serviço é dono dos seus dados)
  # Porta 5433 no host para não conflitar com um PostgreSQL instalado localmente (5432)
  postgres-administrativo:
    image: postgres:17
    container_name: postgres-administrativo
    environment:
      POSTGRES_DB: clinical_administrativo
      POSTGRES_USER: clinical
      POSTGRES_PASSWORD: clinical
    ports:
      - "5433:5432"
    volumes:
      - postgres-administrativo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "clinical", "-d", "clinical_administrativo"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql-agendamento:
    image: mysql:8.4
    container_name: mysql-agendamento
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clinical_agendamento
      MYSQL_USER: clinical
      MYSQL_PASSWORD: clinical
    ports:
      - "3308:3306"
    volumes:
      - mysql-agendamento-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # RabbitMQ: recebe os eventos do ms-administrativo (exchange adm.events). Painel: http://localhost:15672
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: clinical
      RABBITMQ_DEFAULT_PASS: clinical
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Keycloak: login, grupos e permissões (client roles do client ms-administrativo). Realm importado de
  # keycloak/realm-clinical.json na primeira subida. Console: http://localhost:8180 (admin/admin)
  postgres-keycloak:
    image: postgres:17
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Todo token sai com iss=http://localhost:8180/realms/clinical, mesmo quando pedido de dentro da rede do
      # compose (keycloak:8080): assim o mesmo token vale para quem chama de fora e para os serviços.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      # A imagem não tem curl: HTTP "na mão" na porta de gerenciamento (9000)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ms-administrativo:
    build:
      context: .
      dockerfile: ms-administrativo/Dockerfile
    image: clinical/ms-administrativo:latest
    container_name: ms-administrativo
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres-administrativo:5432/clinical_administrativo
      DB_USER: clinical
      DB_PASSWORD: clinical
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: clinical
      RABBITMQ_PASSWORD: clinical
      # Keycloak (valores de desenvolvimento; sobrescreva com um arquivo .env fora do ambiente local).
      # Chaves públicas e Admin API pela rede interna; o issuer é o endereço público (ver KC_HOSTNAME)
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180/realms/clinical
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_ADMINISTRATIVO_SECRET:-dev-ms-administrativo-secret}
    ports:
      - "8081:8081"
    depends_on:
      postgres-administrativo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ms-agendamento:
    build:
      context: .
      dockerfile: ms-agendamento/Dockerfile
    image: clinical/ms-agendamento:latest
    container_name: ms-agendamento
    environment:
      DB_URL: jdbc:mysql://mysql-agendamento:3306/clinical_agendamento?serverTimezone=UTC
      DB_USER: clinical
      DB_PASSWORD: clinical
      ADMINISTRATIVO_URL: http://ms-administrativo:8081
      # Token client credentials do client ms-agendamento no Keycloak
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/clinical/protocol/openid-connect/token
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_AGENDAMENTO_SECRET:-dev-ms-agendamento-secret}
    ports:
      - "8082:8082"
    depends_on:
      mysql-agendamento:
        condition: service_healthy
      ms-administrativo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: clinical/api-gateway:latest
    container_name: api-gateway
    environment:
      ADMINISTRATIVO_URL: http://ms-administrativo:8081
      AGENDAMENTO_URL: http://ms-agendamento:8082
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/clinical/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8180/realms/clinical
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      ms-administrativo:
        condition: service_healthy
      ms-agendamento:
        condition: service_healthy

volumes:
  postgres-administrativo-data:
  mysql-agendamento-data:
  postgres-keycloak-data:
