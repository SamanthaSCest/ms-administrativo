openapi: 3.0.3
info:
  title: Clinical - ms-agendamento
  version: 1.0.0
  description: |
    Contrato da API do **ms-agendamento** (consultas).

    Este arquivo é a fonte de verdade: a implementação deve respeitá-lo.

    **Comunicação entre módulos:** ao agendar, este serviço consulta o **ms-administrativo**
    (`GET /medicos/{id}` e `GET /pacientes/{id}`) para validar médico e paciente.
    Se o ms-administrativo estiver fora do ar, a resposta é `503`.

    Acesso direto: `http://localhost:8082` — via gateway: `http://localhost:8080/agendamento`.
servers:
  - url: http://localhost:8082
    description: Direto no microserviço
  - url: http://localhost:8080/agendamento
    description: Via API Gateway
tags:
  - name: Consultas

paths:
  /consultas:
    get:
      tags: [Consultas]
      summary: Lista consultas (paginado, com filtros opcionais)
      operationId: listarConsultas
      parameters:
        - name: medicoId
          in: query
          schema:
            type: integer
            format: int64
        - name: pacienteId
          in: query
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusConsulta'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de consultas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Consultas]
      summary: Agenda uma consulta
      description: |
        Valida no ms-administrativo que médico e paciente existem.
        Status inicial: `AGENDADO`.
      operationId: agendarConsulta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaRequest'
      responses:
        '201':
          description: Consulta agendada. Header `Location` aponta para o recurso.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /consultas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Consultas]
      summary: Busca consulta por id
      operationId: buscarConsulta
      responses:
        '200':
          description: Consulta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Consultas]
      summary: Remarca/atualiza uma consulta
      description: |
        Só é permitido para consultas `AGENDADO` ou `REMARCADO`.
        Se a data mudar o status passa a `REMARCADO`.
      operationId: remarcarConsulta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaUpdateRequest'
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /consultas/{id}/cancelar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Consultas]
      summary: Cancela uma consulta
      description: Só é permitido para consultas `AGENDADO` ou `REMARCADO`.
      operationId: cancelarConsulta
      responses:
        '200':
          description: Cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /consultas/{id}/realizar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Consultas]
      summary: Marca a consulta como realizada
      description: Só é permitido para consultas `AGENDADO` ou `REMARCADO`.
      operationId: realizarConsulta
      responses:
        '200':
          description: Realizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      description: Número da página (começa em 0)
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Itens por página
      schema:
        type: integer
        minimum: 1
        default: 20
    Sort:
      name: sort
      in: query
      description: 'Ordenação, ex.: `dataAgendamento,desc`'
      schema:
        type: string

  responses:
    BadRequest:
      description: Requisição inválida (validação de campos, JSON malformado, parâmetro inválido)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Médico já possui consulta ativa nesse horário
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Regra de negócio violada (médico/paciente inexistente, transição de status inválida)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: ms-administrativo indisponível
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      description: Formato padrão de erro (produzido pelo @RestControllerAdvice)
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 422
        error:
          type: string
          example: Unprocessable Entity
        message:
          type: string
          example: "Médico não encontrado: 10"
        path:
          type: string
          example: /consultas
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldDetail'
    FieldDetail:
      type: object
      properties:
        field:
          type: string
          example: dataAgendamento
        message:
          type: string
          example: deve ser uma data futura

    PageMetadata:
      type: object
      properties:
        size:
          type: integer
        number:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    StatusConsulta:
      type: string
      enum: [AGENDADO, CANCELADO, REALIZADO, REMARCADO]

    ConsultaRequest:
      type: object
      required: [medicoId, pacienteId, dataAgendamento]
      properties:
        medicoId:
          type: integer
          format: int64
          description: Id do médico no ms-administrativo
        pacienteId:
          type: integer
          format: int64
          description: Id do paciente no ms-administrativo
        dataAgendamento:
          type: string
          format: date-time
          description: Deve estar no futuro (sem fuso, ex. `2030-05-10T14:30:00`)
          example: '2030-05-10T14:30:00'
        sintomas:
          type: string
          maxLength: 500
        observacoes:
          type: string
          maxLength: 500
        numeroCarteiraPlanoSaude:
          type: string
          maxLength: 50
    ConsultaUpdateRequest:
      type: object
      required: [dataAgendamento]
      properties:
        dataAgendamento:
          type: string
          format: date-time
          description: Deve estar no futuro
        sintomas:
          type: string
          maxLength: 500
        observacoes:
          type: string
          maxLength: 500
        numeroCarteiraPlanoSaude:
          type: string
          maxLength: 50
    ConsultaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        medicoId:
          type: integer
          format: int64
        pacienteId:
          type: integer
          format: int64
        dataAgendamento:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/StatusConsulta'
        sintomas:
          type: string
        observacoes:
          type: string
        numeroCarteiraPlanoSaude:
          type: string
        dataCriacao:
          type: string
          format: date-time
        dataModificacao:
          type: string
          format: date-time
    ConsultaPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ConsultaResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'
