server:
  port: ${SERVER_PORT:8082}

# ${VARIAVEL:padrão} = usa a variável de ambiente se existir (Docker), senão o valor padrão (execução local)
spring:
  application:
    name: ms-agendamento
  # Fora do Docker (IDE, mvn spring-boot:run), lê as credenciais do .env da raiz do repositório
  # (o diretório de trabalho pode ser o módulo ou a raiz, por isso os dois caminhos)
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/clinical_agendamento?serverTimezone=UTC}
    # Sem valor padrão: usuário e senha vêm do ambiente (DB_USER/DB_PASSWORD no Docker) ou do .env
    username: ${DB_USER:${AGENDAMENTO_DB_USER}}
    password: ${DB_PASSWORD:${AGENDAMENTO_DB_PASSWORD}}
  jpa:
    open-in-view: false  # evita consultas lazy "escondidas" na camada web
    hibernate:
      ddl-auto: validate   # o schema é gerenciado pelo Flyway (db/migration)
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    # Swagger UI exibe o contrato escrito à mão (fonte de verdade)
    url: /contract/openapi-agendamento.yaml
    path: /swagger-ui.html

# Níveis de log (TRACE < DEBUG < INFO < WARN < ERROR). Mude para DEBUG para ver mais detalhes
# do nosso código, ex.: LOGGING_LEVEL_BR_EDU_IMEPAC=DEBUG
logging:
  level:
    br.edu.imepac: INFO

clients:
  administrativo:
    url: ${ADMINISTRATIVO_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s
  # Token client credentials do Keycloak para chamar o ms-administrativo (client "ms-agendamento")
  keycloak:
    token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/clinical/protocol/openid-connect/token}
    client-id: ${KEYCLOAK_CLIENT_ID:ms-agendamento}
    # Sem valor padrão: KEYCLOAK_CLIENT_SECRET no Docker ou KEYCLOAK_AGENDAMENTO_SECRET do .env
    client-secret: ${KEYCLOAK_CLIENT_SECRET:${KEYCLOAK_AGENDAMENTO_SECRET}}
