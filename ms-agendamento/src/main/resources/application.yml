server:
  port: ${SERVER_PORT:8082}

# ${VARIAVEL:padrão} = usa a variável de ambiente se existir (Docker), senão o valor padrão (execução local)
spring:
  application:
    name: ms-agendamento
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/clinical_agendamento?serverTimezone=UTC}
    username: ${DB_USER:clinical}
    password: ${DB_PASSWORD:clinical}
  jpa:
    open-in-view: false  # evita consultas lazy "escondidas" na camada web
    hibernate:
      ddl-auto: validate   # o schema é gerenciado pelo Flyway (db/migration)
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    # Swagger UI exibe o contrato escrito à mão (fonte de verdade)
    url: /contract/openapi-agendamento.yaml
    path: /swagger-ui.html

# Níveis de log (TRACE < DEBUG < INFO < WARN < ERROR). Mude para DEBUG para ver mais detalhes
# do nosso código, ex.: LOGGING_LEVEL_BR_EDU_IMEPAC=DEBUG
logging:
  level:
    br.edu.imepac: INFO

clients:
  administrativo:
    url: ${ADMINISTRATIVO_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s
