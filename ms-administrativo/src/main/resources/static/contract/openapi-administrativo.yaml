openapi: 3.0.3
info:
  title: Clinical - ms-administrativo
  version: 1.0.0
  description: |
    Contrato da API do **ms-administrativo** (cadastros base da clínica).

    Este arquivo é a fonte de verdade: a implementação deve respeitá-lo e outros times
    (ex.: ms-agendamento) podem se basear nele para consumir a API.

    Acesso direto: `http://localhost:8081` — via gateway: `http://localhost:8080/administrativo`.
servers:
  - url: http://localhost:8081
    description: Direto no microserviço
  - url: http://localhost:8080/administrativo
    description: Via API Gateway
tags:
  - name: Especialidades
  - name: Médicos
  - name: Pacientes
  - name: Integração
    description: Leituras para outros microserviços (somente leitura, CPF mascarado)

paths:
  /especialidades:
    get:
      tags: [Especialidades]
      summary: Lista especialidades (paginado)
      operationId: listarEspecialidades
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de especialidades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspecialidadePage'
    post:
      tags: [Especialidades]
      summary: Cadastra uma especialidade
      operationId: criarEspecialidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EspecialidadeRequest'
      responses:
        '201':
          description: Criada. Header `Location` aponta para o recurso.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspecialidadeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /especialidades/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Especialidades]
      summary: Busca especialidade por id
      operationId: buscarEspecialidade
      responses:
        '200':
          description: Especialidade encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspecialidadeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Especialidades]
      summary: Atualiza uma especialidade
      operationId: atualizarEspecialidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EspecialidadeRequest'
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspecialidadeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Especialidades]
      summary: Remove uma especialidade
      description: Retorna 409 se existirem médicos vinculados.
      operationId: removerEspecialidade
      responses:
        '204':
          description: Removida
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /medicos:
    get:
      tags: [Médicos]
      summary: Lista médicos (paginado)
      operationId: listarMedicos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de médicos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicoPage'
    post:
      tags: [Médicos]
      summary: Cadastra um médico
      operationId: criarMedico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicoRequest'
      responses:
        '201':
          description: Criado. Header `Location` aponta para o recurso.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /medicos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Médicos]
      summary: Busca médico por id
      description: Também usado pelo ms-agendamento para validar a existência do médico.
      operationId: buscarMedico
      responses:
        '200':
          description: Médico encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicoResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Médicos]
      summary: Atualiza um médico
      operationId: atualizarMedico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicoRequest'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Médicos]
      summary: Remove um médico
      operationId: removerMedico
      responses:
        '204':
          description: Removido
        '404':
          $ref: '#/components/responses/NotFound'

  /pacientes:
    get:
      tags: [Pacientes]
      summary: Lista pacientes (paginado)
      operationId: listarPacientes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de pacientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacientePage'
    post:
      tags: [Pacientes]
      summary: Cadastra um paciente
      operationId: criarPaciente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteRequest'
      responses:
        '201':
          description: Criado. Header `Location` aponta para o recurso.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /pacientes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Pacientes]
      summary: Busca paciente por id
      description: Também usado pelo ms-agendamento para validar a existência do paciente.
      operationId: buscarPaciente
      responses:
        '200':
          description: Paciente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Pacientes]
      summary: Atualiza um paciente
      operationId: atualizarPaciente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteRequest'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Pacientes]
      summary: Remove um paciente
      operationId: removerPaciente
      responses:
        '204':
          description: Removido
        '404':
          $ref: '#/components/responses/NotFound'

  /integracao/pacientes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Integração]
      summary: Resumo do paciente para outros microserviços
      description: CPF sempre mascarado (LGPD).
      operationId: integracaoBuscarPaciente
      responses:
        '200':
          description: Resumo do paciente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteResumo'
        '404':
          $ref: '#/components/responses/NotFound'
  /integracao/pacientes/{id}/situacao:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Integração]
      summary: Checagem rápida de existência do paciente
      description: Responde 200 mesmo quando o id não existe (existe = false), para o chamador não tratar como erro.
      operationId: integracaoSituacaoPaciente
      responses:
        '200':
          description: Situação do paciente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Situacao'
  /integracao/pacientes/{id}/contato:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Integração]
      summary: Contato do paciente (para notificações)
      operationId: integracaoContatoPaciente
      responses:
        '200':
          description: Contato do paciente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteContato'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      description: Número da página (começa em 0)
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Itens por página
      schema:
        type: integer
        minimum: 1
        default: 20
    Sort:
      name: sort
      in: query
      description: 'Ordenação, ex.: `nome,asc`'
      schema:
        type: string

  responses:
    BadRequest:
      description: Requisição inválida (validação de campos, JSON malformado, parâmetro inválido)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflito (valor único duplicado ou recurso em uso)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: "Regra de negócio violada (ex.: especialidade informada não existe)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      description: Formato padrão de erro (produzido pelo @RestControllerAdvice)
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: "Médico não encontrado: 10"
        path:
          type: string
          example: /medicos/10
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldDetail'
    FieldDetail:
      type: object
      properties:
        field:
          type: string
          example: cpf
        message:
          type: string
          example: deve conter 11 dígitos

    PageMetadata:
      type: object
      properties:
        size:
          type: integer
        number:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    EspecialidadeRequest:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          maxLength: 100
          example: Cardiologia
        descricao:
          type: string
          maxLength: 255
          example: Doenças do coração
    EspecialidadeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        descricao:
          type: string
        dataCriacao:
          type: string
          format: date-time
        dataModificacao:
          type: string
          format: date-time
    EspecialidadePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EspecialidadeResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    MedicoRequest:
      type: object
      required: [nome, cpf, dataNascimento, crm, especialidadeId]
      properties:
        nome:
          type: string
          maxLength: 150
          example: Maria Souza
        cpf:
          type: string
          pattern: '^\d{11}$'
          example: '12345678901'
        email:
          type: string
          format: email
          maxLength: 150
        telefone:
          type: string
          maxLength: 20
          example: '18999999999'
        dataNascimento:
          type: string
          format: date
          description: Deve estar no passado
          example: '1985-04-20'
        crm:
          type: string
          maxLength: 20
          example: CRM-SP-123456
        especialidadeId:
          type: integer
          format: int64
    MedicoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        cpf:
          type: string
        email:
          type: string
        telefone:
          type: string
        dataNascimento:
          type: string
          format: date
        crm:
          type: string
        especialidade:
          $ref: '#/components/schemas/EspecialidadeResponse'
        dataCriacao:
          type: string
          format: date-time
        dataModificacao:
          type: string
          format: date-time
    MedicoPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MedicoResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PacienteRequest:
      type: object
      required: [nome, cpf, dataNascimento]
      properties:
        nome:
          type: string
          maxLength: 150
          example: João Pereira
        cpf:
          type: string
          pattern: '^\d{11}$'
          example: '98765432100'
        email:
          type: string
          format: email
          maxLength: 150
        telefone:
          type: string
          maxLength: 20
        dataNascimento:
          type: string
          format: date
          description: Deve estar no passado
          example: '1990-01-15'
    PacienteResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        cpf:
          type: string
        email:
          type: string
        telefone:
          type: string
        dataNascimento:
          type: string
          format: date
        dataCriacao:
          type: string
          format: date-time
        dataModificacao:
          type: string
          format: date-time
    PacientePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PacienteResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PacienteResumo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        cpfMascarado:
          type: string
          example: '***.456.789-**'
        dataNascimento:
          type: string
          format: date
    Situacao:
      type: object
      properties:
        existe:
          type: boolean
        ativo:
          type: boolean
    PacienteContato:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
        telefone:
          type: string
