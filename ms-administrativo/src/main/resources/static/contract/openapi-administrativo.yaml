openapi: 3.0.3
info:
  title: Clinical - ms-administrativo
  version: 1.1.0
  description: |
    Contrato da API do **ms-administrativo** (cadastros base da clínica).

    Este arquivo é a fonte de verdade: a implementação deve respeitá-lo e outros times
    (ex.: ms-agendamento) podem se basear nele para consumir a API.

    Acesso direto: `http://localhost:8081` — via gateway: `http://localhost:8080/administrativo`.

    ## Autenticação

    Só a equipe da clínica acessa o sistema: **funcionários** (nível `ADMIN` ou `FUNCIONARIO`) e **médicos** (`MEDICO`).
    Pacientes são apenas registros e **não têm login**.

    1. Faça `POST /auth/login` com `login` e `senha`. Funcionários e médicos usam o **CPF** como login;
       o administrador inicial é configurado por `ADMIN_LOGIN`/`ADMIN_PASSWORD` (padrão local: `admin`/`admin12345`).
    2. Clique em **Authorize** e cole o `accessToken` em `bearerAuth` (sem o prefixo "Bearer").
    3. As demais rotas exigem o header `Authorization: Bearer <token>`. Sem token ou com token inválido/expirado: **401**;
       perfil sem permissão: **403** (ambos no formato `ProblemDetail`).

    Outros microserviços se autenticam com o header `X-Api-Key` (`apiKey`): leitura em geral e, para o
    ms-estoque, também escrita em `/insumos`.

    O nível de acesso do funcionário vem do **cargo**: `ADMINISTRADOR` → `ADMIN`; os demais → `FUNCIONARIO`.

    | Recurso | ADMIN | FUNCIONARIO | MEDICO | Serviço (X-Api-Key) |
    |---|---|---|---|---|
    | `/auth/me`, `/auth/senha` | ✔ | ✔ | ✔ | — |
    | `/usuarios`, `/funcionarios` | ✔ | — | — | — |
    | Especialidades, médicos, convênios, salas, procedimentos (leitura) | ✔ | ✔ | ✔ | ✔ |
    | Especialidades, médicos, convênios, salas, procedimentos (escrita) | ✔ | — | — | — |
    | Pacientes e responsáveis legais (leitura) | ✔ | ✔ | ✔ | ✔ |
    | Pacientes e responsáveis legais (escrita) | ✔ | ✔ | — | — |
    | Insumos (leitura) | ✔ | ✔ | ✔ | ✔ |
    | Insumos (escrita) | ✔ | — | — | ✔ (ms-estoque) |
    | Custos dos médicos (leitura) | ✔ | ✔ | — | ✔ |
    | Custos dos médicos (escrita) | ✔ | — | — | — |
    | Disponibilidades (leitura, inclusive `/agenda`) | ✔ | ✔ | ✔ | ✔ |
    | Disponibilidades (escrita) | ✔ | — | — | — |
    | `/integracao/**` | ✔ | — | — | ✔ |
servers:
  - url: http://localhost:8081
    description: Direto no microserviço
  - url: http://localhost:8080/administrativo
    description: Via API Gateway
tags:
  - name: Autenticação
    description: Login (JWT), dados do usuário logado e troca de senha
  - name: Usuários
    description: Gestão dos usuários de acesso (somente ADMIN)
  - name: Funcionários
    description: Cadastro da equipe da clínica com dados pessoais e profissionais (somente ADMIN)
  - name: Especialidades
  - name: Médicos
  - name: Pacientes
  - name: Responsáveis legais
    description: Responsáveis por pacientes menores de idade
  - name: Convênios
  - name: Salas
  - name: Insumos
    description: Mantidos também pelo ms-estoque (X-Api-Key)
  - name: Procedimentos
    description: Procedimentos (código TUSS) e os insumos que consomem
  - name: Custos dos médicos
    description: Valor de consulta (por especialidade) ou de procedimento, com vigência
  - name: Disponibilidades
    description: Horários de atendimento dos médicos, cadastrados pelo ADMIN
  - name: Ativação
    description: Inativar/reativar cadastros (EntidadeBase) sem apagá-los
  - name: Integração
    description: Leituras para outros microserviços (somente leitura, CPF mascarado)

# Por padrão toda operação exige Bearer token; exceções declaram "security" próprio
security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica e devolve um token JWT
      description: Rota pública. A mesma resposta 401 é dada para login inexistente, senha errada ou usuário inativo.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Autenticação]
      summary: Dados do usuário dono do token
      operationId: usuarioAutenticado
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/senha:
    put:
      tags: [Autenticação]
      summary: Troca a senha do usuário autenticado
      operationId: alterarSenha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarSenhaRequest'
      responses:
        '204':
          description: Senha alterada
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Senha atual incorreta
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /usuarios:
    get:
      tags: [Usuários]
      summary: Lista usuários (paginado)
      operationId: listarUsuarios
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de usuários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Usuários]
      summary: Busca usuário por id
      operationId: buscarUsuario
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /usuarios/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Usuários]
      summary: Ativa ou desativa o acesso de um usuário
      description: Usuário inativo não consegue fazer login. O administrador não pode desativar a si mesmo (422).
      operationId: alterarStatusUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioStatusRequest'
      responses:
        '200':
          description: Status alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /funcionarios:
    get:
      tags: [Funcionários]
      summary: Lista funcionários (paginado)
      operationId: listarFuncionarios
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de funcionários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuncionarioPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Funcionários]
      summary: Cadastra um funcionário e o seu usuário de acesso
      description: |
        Cria o funcionário com dados pessoais e profissionais e o usuário de acesso (login = CPF)
        com o nível de acesso definido pelo cargo (`ADMINISTRADOR` → `ADMIN`; demais → `FUNCIONARIO`).
        `senha` é obrigatória.
      operationId: criarFuncionario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuncionarioRequest'
      responses:
        '201':
          description: Criado. Header `Location` aponta para o recurso.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuncionarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /funcionarios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Funcionários]
      summary: Busca funcionário por id
      operationId: buscarFuncionario
      responses:
        '200':
          description: Funcionário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuncionarioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Funcionários]
      summary: Atualiza um funcionário
      description: Se `senha` for informada, a senha do usuário é trocada; o login acompanha o CPF.
      operationId: atualizarFuncionario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuncionarioRequest'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuncionarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Funcionários]
      summary: Remove um funcionário (e o seu usuário de acesso)
      operationId: removerFuncionario
      responses:
        '204':
          description: Removido
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /especialidades:
    get:
      tags: [Especialidades]
      summary: Lista especialidades (paginado)
      operationId: listarEspecialidades
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de especialidades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspecialidadePage'
    post:
      tags: [Especialidades]
      summary: Cadastra uma especialidade
      operationId: criarEspecialidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EspecialidadeRequest'
      responses:
        '201':
          description: Criada. Header `Location` aponta para o recurso.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspecialidadeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /especialidades/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Especialidades]
      summary: Busca especialidade por id
      operationId: buscarEspecialidade
      responses:
        '200':
          description: Especialidade encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspecialidadeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Especialidades]
      summary: Atualiza uma especialidade
      operationId: atualizarEspecialidade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EspecialidadeRequest'
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspecialidadeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Especialidades]
      summary: Remove uma especialidade
      description: Retorna 409 se existirem médicos vinculados.
      operationId: removerEspecialidade
      responses:
        '204':
          description: Removida
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /medicos:
    get:
      tags: [Médicos]
      summary: Lista médicos (paginado)
      operationId: listarMedicos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de médicos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicoPage'
    post:
      tags: [Médicos]
      summary: Cadastra um médico
      operationId: criarMedico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicoRequest'
      responses:
        '201':
          description: Criado. Header `Location` aponta para o recurso.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /medicos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Médicos]
      summary: Busca médico por id
      description: Também usado pelo ms-agendamento (via `X-Api-Key`) para validar a existência do médico.
      operationId: buscarMedico
      security:
        - bearerAuth: []
        - apiKey: []
      responses:
        '200':
          description: Médico encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicoResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Médicos]
      summary: Atualiza um médico
      operationId: atualizarMedico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicoRequest'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Médicos]
      summary: Remove um médico
      operationId: removerMedico
      responses:
        '204':
          description: Removido
        '404':
          $ref: '#/components/responses/NotFound'

  /pacientes:
    get:
      tags: [Pacientes]
      summary: Lista pacientes (paginado)
      operationId: listarPacientes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Página de pacientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacientePage'
    post:
      tags: [Pacientes]
      summary: Cadastra um paciente
      operationId: criarPaciente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteRequest'
      responses:
        '201':
          description: Criado. Header `Location` aponta para o recurso.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /pacientes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Pacientes]
      summary: Busca paciente por id
      description: Também usado pelo ms-agendamento (via `X-Api-Key`) para validar a existência do paciente.
      operationId: buscarPaciente
      security:
        - bearerAuth: []
        - apiKey: []
      responses:
        '200':
          description: Paciente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Pacientes]
      summary: Atualiza um paciente
      operationId: atualizarPaciente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteRequest'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Pacientes]
      summary: Remove um paciente
      operationId: removerPaciente
      responses:
        '204':
          description: Removido
        '404':
          $ref: '#/components/responses/NotFound'

  /integracao/pacientes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Integração]
      summary: Resumo do paciente para outros microserviços
      description: CPF sempre mascarado (LGPD).
      operationId: integracaoBuscarPaciente
      security:
        - apiKey: []
        - bearerAuth: []
      responses:
        '200':
          description: Resumo do paciente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteResumo'
        '404':
          $ref: '#/components/responses/NotFound'

  /integracao/pacientes/{id}/situacao:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Integração]
      summary: Checagem rápida de existência do paciente
      description: Responde 200 mesmo quando o id não existe (existe = false), para o chamador não tratar como erro. `ativo` = false quando o paciente foi inativado.
      operationId: integracaoSituacaoPaciente
      security:
        - apiKey: []
        - bearerAuth: []
      responses:
        '200':
          description: Situação do paciente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Situacao'

  /integracao/pacientes/{id}/contato:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Integração]
      summary: Contato do paciente (para notificações)
      operationId: integracaoContatoPaciente
      security:
        - apiKey: []
        - bearerAuth: []
      responses:
        '200':
          description: Contato do paciente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacienteContato'
        '404':
          $ref: '#/components/responses/NotFound'
  /integracao/pacientes:
    get:
      tags: [Integração]
      summary: Pacientes em lote (até 100 ids)
      description: Ids inexistentes são ignorados. CPF sempre mascarado.
      operationId: integracaoPacientesLote
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Ids'
      responses:
        '200':
          description: Resumos, ordenados por id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PacienteResumo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /integracao/especialidades:
    get:
      tags: [Integração]
      summary: Especialidades ativas
      operationId: integracaoEspecialidades
      security:
        - apiKey: []
        - bearerAuth: []
      responses:
        '200':
          description: Especialidades ativas, por nome
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EspecialidadeResumo'
  /integracao/medicos:
    get:
      tags: [Integração]
      summary: Médicos em lote e/ou por especialidade
      description: |
        `ids` (até 100) traz os médicos informados, de qualquer status. `especialidadeId` traz os médicos **ativos**
        que atendem a especialidade. Com os dois, devolve a interseção. Sem nenhum dos dois: 422.
      operationId: integracaoMedicos
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: ids
          in: query
          description: Ids separados por vírgula (até 100)
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: false
        - name: especialidadeId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Resumos, ordenados por nome
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicoResumo'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /integracao/medicos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Integração]
      summary: Resumo do médico
      operationId: integracaoMedico
      security:
        - apiKey: []
        - bearerAuth: []
      responses:
        '200':
          description: Resumo do médico (sem CPF)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicoResumo'
        '404':
          $ref: '#/components/responses/NotFound'
  /integracao/medicos/{id}/situacao:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Integração]
      summary: Checagem rápida de existência do médico
      description: Responde 200 mesmo quando o id não existe (existe = false).
      operationId: integracaoSituacaoMedico
      security:
        - apiKey: []
        - bearerAuth: []
      responses:
        '200':
          description: Situação do médico
          content:
