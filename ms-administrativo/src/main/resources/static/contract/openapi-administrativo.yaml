          example: '101'
        tipo:
          $ref: '#/components/schemas/TipoSala'
        andar:
          type: string
          maxLength: 20
          example: 1º
        observacoes:
          type: string
          maxLength: 255
          example: Acesso para cadeirantes
    SalaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
          description: Identificador público (EntidadeBase). A chave usada nas URLs continua sendo o id.
        ativo:
          type: boolean
          description: false = inativado (PATCH /{recurso}/{id}/status)
        criadoPor:
          type: string
          description: Login de quem criou ("servico" para X-Api-Key, "sistema" sem usuário)
        atualizadoPor:
