    # ---------- Insumo ----------
    InsumoRequest:
      type: object
      required: [codigo, nome, unidadeMedida, custoUnitario]
      properties:
        codigo:
          type: string
          maxLength: 30
          description: Único
          example: LUVA-M
        nome:
          type: string
          maxLength: 150
          example: Luva de procedimento M
        descricao:
          type: string
          maxLength: 255
        unidadeMedida:
          type: string
          maxLength: 20
          example: UN
        custoUnitario:
          type: number
          minimum: 0
          example: 0.85
    InsumoCustoRequest:
      type: object
      required: [custoUnitario]
      properties:
        custoUnitario:
          type: number
          minimum: 0
          example: 0.95
    InsumoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
          description: Identificador público (EntidadeBase). A chave usada nas URLs continua sendo o id.
        ativo:
          type: boolean
          description: false = inativado (PATCH /{recurso}/{id}/status)
        criadoPor:
          type: string
          description: Login de quem criou ("servico" para X-Api-Key, "sistema" sem usuário)
        atualizadoPor:
          type: string
          description: Login de quem fez a última alteração
        codigo:
          type: string
        nome:
          type: string
        descricao:
          type: string
        unidadeMedida:
          type: string
        custoUnitario:
          type: number
        dataCriacao:
          type: string
          format: date-time
        dataModificacao:
          type: string
          format: date-time
    InsumoPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/InsumoResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    # ---------- Procedimento ----------
    ProcedimentoRequest:
      type: object
      required: [especialidadeId, codigoTuss, nome, duracaoMinutos, valorBase]
      properties:
        especialidadeId:
          type: integer
          format: int64
        codigoTuss:
          type: string
          maxLength: 20
          description: Único
          example: '30101012'
        nome:
          type: string
          maxLength: 150
          example: Biópsia de pele
        descricao:
          type: string
          maxLength: 255
        duracaoMinutos:
          type: integer
          minimum: 1
          maximum: 1440
          example: 30
        valorBase:
          type: number
          minimum: 0
          example: 250.00
        insumos:
          type: array
          description: Cada insumo só pode aparecer uma vez (senão 422)
          items:
            type: object
            required: [insumoId, quantidade]
            properties:
              insumoId:
                type: integer
                format: int64
              quantidade:
                type: number
                minimum: 0.001
                example: 2
    ProcedimentoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
          description: Identificador público (EntidadeBase). A chave usada nas URLs continua sendo o id.
        ativo:
          type: boolean
          description: false = inativado (PATCH /{recurso}/{id}/status)
        criadoPor:
          type: string
          description: Login de quem criou ("servico" para X-Api-Key, "sistema" sem usuário)
        atualizadoPor:
          type: string
          description: Login de quem fez a última alteração
        especialidade:
          $ref: '#/components/schemas/EspecialidadeResponse'
        codigoTuss:
          type: string
        nome:
          type: string
        descricao:
          type: string
        duracaoMinutos:
          type: integer
        valorBase:
          type: number
        insumos:
          type: array
          items:
            type: object
            properties:
              insumo:
                $ref: '#/components/schemas/InsumoResponse'
              quantidade:
                type: number
              custo:
                type: number
                description: custo unitário x quantidade
        custoInsumos:
          type: number
          description: Soma do custo dos insumos (calcularCustoInsumos)
        dataCriacao:
          type: string
          format: date-time
        dataModificacao:
          type: string
          format: date-time
    ProcedimentoPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProcedimentoResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    # ---------- Custo do médico ----------
    CustoMedicoRequest:
      type: object
      required: [tipo, medicoId, valor, vigenciaInicio]
      properties:
        tipo:
          type: string
          enum: [CONSULTA, PROCEDIMENTO]
        medicoId:
          type: integer
          format: int64
        especialidadeId:
          type: integer
          format: int64
          description: Obrigatório para CONSULTA
        procedimentoId:
          type: integer
          format: int64
          description: Obrigatório para PROCEDIMENTO
        valor:
          type: number
          minimum: 0
          example: 200.00
        vigenciaInicio:
          type: string
          format: date
          example: '2025-01-01'
        vigenciaFim:
          type: string
          format: date
          description: Opcional (null = em aberto); não pode ser antes do início
    CustoMedicoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
          description: Identificador público (EntidadeBase). A chave usada nas URLs continua sendo o id.
        ativo:
          type: boolean
          description: false = inativado (PATCH /{recurso}/{id}/status)
        criadoPor:
          type: string
          description: Login de quem criou ("servico" para X-Api-Key, "sistema" sem usuário)
        atualizadoPor:
          type: string
          description: Login de quem fez a última alteração
        tipo:
          type: string
          enum: [CONSULTA, PROCEDIMENTO]
        medico:
          $ref: '#/components/schemas/Referencia'
        especialidade:
          $ref: '#/components/schemas/Referencia'
        procedimento:
          $ref: '#/components/schemas/Referencia'
        valor:
          type: number
        vigenciaInicio:
          type: string
          format: date
        vigenciaFim:
          type: string
          format: date
        vigente:
          type: boolean
          description: Vigente hoje (estaVigente)
        dataCriacao:
          type: string
          format: date-time
        dataModificacao:
          type: string
          format: date-time
    CustoMedicoPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CustoMedicoResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    # ---------- Disponibilidade ----------
    DisponibilidadeRequest:
      type: object
      required: [tipo, medicoId, horaInicial, horaFinal]
      properties:
        tipo:
          type: string
          enum: [DIARIA, EXCECAO]
        medicoId:
          type: integer
          format: int64
        salaId:
          type: integer
          format: int64
        horaInicial:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '08:00'
        horaFinal:
          type: string
          pattern: '^\d{2}:\d{2}$'
          description: Deve ser depois da hora inicial (senão 422)
          example: '12:00'
        observacoes:
          type: string
          maxLength: 255
        diaSemana:
          $ref: '#/components/schemas/DiaSemana'
        data:
          type: string
          format: date
          description: Obrigatório para EXCECAO
        disponivel:
          type: boolean
          description: Obrigatório para EXCECAO (false = bloqueio; true = horário extra)
        motivo:
          type: string
          maxLength: 255
          example: Congresso
    DisponibilidadeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
          description: Identificador público (EntidadeBase). A chave usada nas URLs continua sendo o id.
        ativo:
          type: boolean
          description: false = inativado (PATCH /{recurso}/{id}/status)
        criadoPor:
          type: string
          description: Login de quem criou ("servico" para X-Api-Key, "sistema" sem usuário)
        atualizadoPor:
          type: string
          description: Login de quem fez a última alteração
        tipo:
          type: string
          enum: [DIARIA, EXCECAO]
        medico:
          $ref: '#/components/schemas/Referencia'
        sala:
          $ref: '#/components/schemas/Referencia'
        horaInicial:
          type: string
          example: '08:00'
        horaFinal:
          type: string
          example: '12:00'
        observacoes:
          type: string
        diaSemana:
          $ref: '#/components/schemas/DiaSemana'
        data:
          type: string
          format: date
        disponivel:
          type: boolean
        motivo:
          type: string
        dataCriacao:
          type: string
          format: date-time
        dataModificacao:
          type: string
          format: date-time
    DisponibilidadePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DisponibilidadeResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    # ---------- Ativação (EntidadeBase) ----------
    StatusRequest:
      type: object
      required: [ativo]
      properties:
        ativo:
          type: boolean
          description: true = reativar; false = inativar
          example: false
    StatusResponse:
      type: object
      properties:
        recurso:
          type: string
          example: medicos
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
        ativo:
          type: boolean
        atualizadoPor:
          type: string
        dataModificacao:
          type: string
          format: date-time
