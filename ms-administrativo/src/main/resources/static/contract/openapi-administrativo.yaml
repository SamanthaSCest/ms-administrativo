          description: Atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Disponibilidades]
      summary: Remove uma disponibilidade
      operationId: removerDisponibilidade
      responses:
        '204':
          description: Removida
        '404':
          $ref: '#/components/responses/NotFound'

  /{recurso}/{id}/status:
    parameters:
      - name: recurso
        in: path
        required: true
        schema:
          type: string
          enum: [especialidades, medicos, pacientes, funcionarios, convenios, salas, responsaveis, insumos,
                 procedimentos, custos-medicos, disponibilidades]
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Ativação]
      summary: Ativa ou inativa um cadastro (inativar/reativar da EntidadeBase)
      description: |
        Inativar **não apaga**: o registro continua consultável, mas não pode entrar em vínculos novos (422) e
        custos/disponibilidades inativos são ignorados. Inativar médico ou funcionário também bloqueia o login;
        ninguém pode inativar o próprio cadastro (422). Quem pode chamar segue a regra de **escrita** do recurso
        (ex.: pacientes → ADMIN ou FUNCIONARIO; médicos → ADMIN; insumos → ADMIN ou ms-estoque).
        Usuários têm o endpoint próprio `PATCH /usuarios/{id}/status`.
      operationId: alterarStatusCadastro
      security:
        - bearerAuth: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '200':
          description: Status alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtido em `POST /auth/login` (válido por 2 h por padrão).
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Chave de integração entre microserviços (`INTEGRACAO_API_KEY`). Acesso somente leitura.

  parameters:
    Ids:
      name: ids
      in: query
      required: true
      description: Ids separados por vírgula (até 100)
      schema:
        type: array
        items:
          type: integer
          format: int64
      style: form
      explode: false
      example: [1, 2, 3]
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      description: Número da página (começa em 0)
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Itens por página
      schema:
        type: integer
        minimum: 1
        default: 20
    Sort:
      name: sort
      in: query
      description: 'Ordenação, ex.: `nome,asc`'
      schema:
        type: string

  responses:
    BadRequest:
      description: Requisição inválida (validação de campos, JSON malformado, parâmetro inválido)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Conflito (valor único duplicado ou recurso em uso)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: "Regra de negócio violada (ex.: especialidade informada não existe)"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Não autenticado (token ausente, inválido ou expirado) ou credenciais inválidas no login
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Autenticado, mas o perfil não tem permissão para esta operação
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    ProblemDetail:
      type: object
      description: |
        Formato de erro baseado em Problem Details (RFC 9457).
        O campo campos é incluído quando há erros de validação.
      properties:
        type:
          type: string
          format: uri-reference
          description: URI que identifica o tipo do problema.
          example: about:blank
        title:
          type: string
          description: Resumo legível do tipo de problema.
          example: Dados inválidos
        status:
          type: integer
          format: int32
          description: Código HTTP do problema.
          example: 400
        detail:
          type: string
          description: Explicação legível específica desta ocorrência.
          example: Um ou mais campos são inválidos.
        instance:
          type: string
          format: uri-reference
          description: URI da ocorrência específica do problema.
          example: /medicos/10
        codigo:
          type: string
          description: Código de erro do catálogo do ms-administrativo.
          example: ADM-GEN-400
        campos:
          type: array
          description: Lista de erros de validação, quando aplicável.
          items:
            $ref: '#/components/schemas/ProblemField'

    ProblemField:
      type: object
      properties:
        campo:
          type: string
          description: Nome do campo inválido.
          example: cpf
        mensagem:
          type: string
          description: Motivo da falha de validação.
          example: deve conter 11 dígitos

    PageMetadata:
      type: object
      properties:
        size:
          type: integer
        number:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    EspecialidadeRequest:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          maxLength: 100
          example: Cardiologia
        descricao:
          type: string
          maxLength: 255
          example: Doenças do coração

    EspecialidadeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
          description: Identificador público (EntidadeBase). A chave usada nas URLs continua sendo o id.
        ativo:
          type: boolean
          description: false = inativado (PATCH /{recurso}/{id}/status)
        criadoPor:
          type: string
          description: Login de quem criou ("servico" para X-Api-Key, "sistema" sem usuário)
        atualizadoPor:
          type: string
          description: Login de quem fez a última alteração
        nome:
          type: string
        descricao:
          type: string
        dataCriacao:
          type: string
          format: date-time
        dataModificacao:
          type: string
          format: date-time

    EspecialidadePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EspecialidadeResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    MedicoRequest:
      type: object
      required: [nome, cpf, dataNascimento, crm, ufCrm, especialidadeIds]
      properties:
        nome:
          type: string
          maxLength: 150
          example: Maria Souza
        cpf:
          type: string
          pattern: '^\d{11}$'
          example: '12345678901'
        email:
          type: string
          format: email
          maxLength: 150
        telefone:
          type: string
          maxLength: 20
          example: '18999999999'
        dataNascimento:
          type: string
          format: date
          description: Deve estar no passado
          example: '1985-04-20'
        crm:
          type: string
          maxLength: 20
          description: Único por UF (ufCrm)
          example: '123456'
        ufCrm:
          $ref: '#/components/schemas/UF'
        especialidadeIds:
          type: array
          minItems: 1
          description: Especialidades que o médico atende (pelo menos uma)
          items:
            type: integer
            format: int64
          example: [1, 2]
        senha:
          $ref: '#/components/schemas/SenhaPessoa'
    MedicoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
          description: Identificador público (EntidadeBase). A chave usada nas URLs continua sendo o id.
        ativo:
          type: boolean
          description: false = inativado (PATCH /{recurso}/{id}/status)
        criadoPor:
          type: string
          description: Login de quem criou ("servico" para X-Api-Key, "sistema" sem usuário)
        atualizadoPor:
          type: string
          description: Login de quem fez a última alteração
        nome:
          type: string
        cpf:
          type: string
        email:
          type: string
        telefone:
          type: string
        dataNascimento:
          type: string
          format: date
        crm:
          type: string
        ufCrm:
          $ref: '#/components/schemas/UF'
        especialidades:
          type: array
          items:
            $ref: '#/components/schemas/EspecialidadeResponse'
        usuario:
          $ref: '#/components/schemas/UsuarioResponse'
        dataCriacao:
          type: string
          format: date-time
        dataModificacao:
          type: string
          format: date-time

    MedicoPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MedicoResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PacienteRequest:
      type: object
      required: [nome, cpf, dataNascimento]
      properties:
        nome:
          type: string
          maxLength: 150
          example: João Pereira
        cpf:
          type: string
          pattern: '^\d{11}$'
          example: '98765432100'
        email:
          type: string
          format: email
          maxLength: 150
        telefone:
          type: string
          maxLength: 20
          description: Celular
        dataNascimento:
          type: string
          format: date
          description: Deve estar no passado
          example: '1990-01-15'
        sexo:
          $ref: '#/components/schemas/Sexo'
        telefoneFixo:
          type: string
          maxLength: 20
        endereco:
          $ref: '#/components/schemas/Endereco'
        responsavelId:
          type: integer
          format: int64
          description: Responsável legal. **Obrigatório para menores de 18 anos** (senão 422).
    PacienteResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
          description: Identificador público (EntidadeBase). A chave usada nas URLs continua sendo o id.
        ativo:
          type: boolean
          description: false = inativado (PATCH /{recurso}/{id}/status)
        criadoPor:
          type: string
          description: Login de quem criou ("servico" para X-Api-Key, "sistema" sem usuário)
        atualizadoPor:
          type: string
          description: Login de quem fez a última alteração
        nome:
          type: string
        cpf:
          type: string
        email:
          type: string
        telefone:
          type: string
          description: Celular
        dataNascimento:
          type: string
          format: date
        sexo:
          $ref: '#/components/schemas/Sexo'
        telefoneFixo:
          type: string
        endereco:
          $ref: '#/components/schemas/Endereco'
        responsavel:
          $ref: '#/components/schemas/ResponsavelLegalResponse'
        idade:
          type: integer
          description: Calculada a partir da data de nascimento
        menorDeIdade:
          type: boolean
        dataCriacao:
          type: string
          format: date-time
        dataModificacao:
          type: string
          format: date-time

    PacientePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PacienteResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PacienteResumo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        cpfMascarado:
          type: string
          example: '***.456.789-**'
        dataNascimento:
          type: string
          format: date
        uuid:
          type: string
          format: uuid
        ativo:
          type: boolean
    EspecialidadeResumo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
        nome:
          type: string
        ativo:
          type: boolean
    MedicoResumo:
      type: object
      description: Sem CPF. Também é o campo `dados` dos eventos medico.*
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
        nome:
          type: string
        crm:
          type: string
        ufCrm:
          $ref: '#/components/schemas/UF'
        especialidades:
          type: array
          items:
            $ref: '#/components/schemas/EspecialidadeResumo'
        ativo:
          type: boolean
    SalaResumo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
        numero:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoSala'
        andar:
          type: string
        observacoes:
          type: string
        ativo:
          type: boolean
    ConvenioResumo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
        nome:
          type: string
        registroAns:
          type: string
        cnpj:
          type: string
        ativo:
          type: boolean
    AtendeResponse:
      type: object
      properties:
        atende:
          type: boolean

    Situacao:
      type: object
      properties:
        existe:
          type: boolean
        ativo:
          type: boolean

    PacienteContato:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
        telefone:
          type: string

    # ---------- Autenticação e usuários ----------
    Perfil:
      type: string
      enum: [ADMIN, FUNCIONARIO, MEDICO]
      description: Nível de acesso do usuário (vira ROLE_<perfil> na API). Paciente não tem acesso.
    SenhaPessoa:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      writeOnly: true
      description: |
        Senha do usuário de acesso (login = CPF). **Obrigatória no cadastro (POST)**; na atualização (PUT),
        se informada, troca a senha. Armazenada apenas como hash BCrypt.
      example: senhaForte1
    LoginRequest:
      type: object
      required: [login, senha]
      properties:
        login:
          type: string
          description: CPF (médico ou funcionário) ou login do administrador inicial
          example: admin
        senha:
          type: string
          format: password
          example: admin12345
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT (HS256) com os claims sub (login), uid, perfil, iss, iat e exp
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Validade do token em segundos
          example: 7200
        usuario:
          $ref: '#/components/schemas/UsuarioResponse'
    AlterarSenhaRequest:
      type: object
      required: [senhaAtual, novaSenha]
      properties:
        senhaAtual:
          type: string
          format: password
        novaSenha:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    UsuarioResponse:
      type: object
      description: Usuário de acesso (a senha nunca é devolvida)
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
          example: '12345678901'
        perfil:
          $ref: '#/components/schemas/Perfil'
        ativo:
          type: boolean
        dataCriacao:
          type: string
          format: date-time
        dataModificacao:
          type: string
          format: date-time
    UsuarioPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UsuarioResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'
    UsuarioStatusRequest:
      type: object
      required: [ativo]
      properties:
        ativo:
          type: boolean
          example: false

    # ---------- Funcionários ----------
    FuncionarioRequest:
      type: object
      required: [nome, cpf, dataNascimento, matricula, cargo, dataAdmissao]
      properties:
        nome:
          type: string
          maxLength: 150
          example: Ana Lima
        cpf:
          type: string
          pattern: '^\d{11}$'
          example: '11122233344'
        email:
          type: string
          format: email
          maxLength: 150
          example: ana@clinica.com
        telefone:
          type: string
          maxLength: 20
          example: '34999990000'
        dataNascimento:
          type: string
          format: date
          description: Deve estar no passado
          example: '1992-03-10'
        matricula:
          type: string
          maxLength: 20
          description: Única por funcionário
          example: F-001
        cargo:
          $ref: '#/components/schemas/Cargo'
        setor:
          type: string
          maxLength: 100
          example: Recepção
        dataAdmissao:
          type: string
          format: date
          description: Não pode estar no futuro
          example: '2024-02-01'
        senha:
          $ref: '#/components/schemas/SenhaPessoa'
    FuncionarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
          description: Identificador público (EntidadeBase). A chave usada nas URLs continua sendo o id.
        ativo:
          type: boolean
          description: false = inativado (PATCH /{recurso}/{id}/status)
        criadoPor:
          type: string
          description: Login de quem criou ("servico" para X-Api-Key, "sistema" sem usuário)
        atualizadoPor:
          type: string
          description: Login de quem fez a última alteração
        nome:
          type: string
        cpf:
          type: string
        email:
          type: string
        telefone:
          type: string
        dataNascimento:
          type: string
          format: date
        matricula:
          type: string
        cargo:
          $ref: '#/components/schemas/Cargo'
        setor:
          type: string
        dataAdmissao:
          type: string
          format: date
        usuario:
          $ref: '#/components/schemas/UsuarioResponse'
        dataCriacao:
          type: string
          format: date-time
        dataModificacao:
          type: string
          format: date-time
    FuncionarioPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/FuncionarioResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    # ---------- Enums e tipos comuns ----------
    UF:
      type: string
      enum: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
      example: MG
    Sexo:
      type: string
      enum: [MASCULINO, FEMININO, OUTRO]
    Cargo:
      type: string
      enum: [RECEPCIONISTA, ESTOQUISTA, RESPONSAVEL_FINANCEIRO, ADMINISTRADOR]
      description: Define o nível de acesso (ADMINISTRADOR → ADMIN; demais → FUNCIONARIO)
    TipoSala:
      type: string
      enum: [CONSULTORIO, CIRURGIA, PROCEDIMENTO]
    DiaSemana:
      type: string
      enum: [DOMINGO, SEGUNDA, TERCA, QUARTA, QUINTA, SEXTA, SABADO]
    Referencia:
      type: object
      description: Resumo de um registro relacionado
      properties:
        id:
          type: integer
          format: int64
        descricao:
          type: string
    Endereco:
      type: object
      description: Opcional; se enviado, precisa estar completo. `formatado` só vem na resposta.
      required: [cep, logradouro, numero, bairro, cidade, uf]
      properties:
        cep:
          type: string
          pattern: '^\d{8}$'
          example: '38440000'
        logradouro:
          type: string
          maxLength: 150
          example: Rua A
        numero:
          type: string
          maxLength: 10
          example: '10'
        complemento:
          type: string
          maxLength: 60
        bairro:
          type: string
          maxLength: 80
          example: Centro
        cidade:
          type: string
          maxLength: 80
          example: Araguari
        uf:
          $ref: '#/components/schemas/UF'
        formatado:
          type: string
          readOnly: true
          example: Rua A, 10 - Centro - Araguari/MG - CEP 38440-000

    # ---------- Responsável legal ----------
    ResponsavelLegalRequest:
      type: object
      required: [nome, cpf, parentesco]
      properties:
        nome:
          type: string
          maxLength: 150
        cpf:
          type: string
          description: CPF com dígitos verificadores válidos
          example: '52998224725'
        telefone:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
        parentesco:
          type: string
          maxLength: 50
          example: MÃE
    ResponsavelLegalResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
          description: Identificador público (EntidadeBase). A chave usada nas URLs continua sendo o id.
        ativo:
          type: boolean
          description: false = inativado (PATCH /{recurso}/{id}/status)
        criadoPor:
          type: string
          description: Login de quem criou ("servico" para X-Api-Key, "sistema" sem usuário)
        atualizadoPor:
          type: string
          description: Login de quem fez a última alteração
        nome:
          type: string
        cpf:
          type: string
        telefone:
          type: string
        email:
          type: string
        parentesco:
          type: string
        dataCriacao:
          type: string
          format: date-time
        dataModificacao:
          type: string
          format: date-time
    ResponsavelLegalPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ResponsavelLegalResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    # ---------- Convênio ----------
    ConvenioRequest:
      type: object
      required: [nome, registroAns, cnpj]
      properties:
        nome:
          type: string
          maxLength: 150
          example: Unimed
        registroAns:
          type: string
          maxLength: 20
          description: Único
          example: '123456'
        cnpj:
          type: string
          pattern: '^\d{14}$'
          description: Único, com dígitos verificadores válidos
          example: '11222333000181'
        telefone:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
    ConvenioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
          description: Identificador público (EntidadeBase). A chave usada nas URLs continua sendo o id.
        ativo:
          type: boolean
          description: false = inativado (PATCH /{recurso}/{id}/status)
        criadoPor:
          type: string
