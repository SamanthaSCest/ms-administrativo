spring.application.name=ms-administrativo

# Conexão com o PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/clinica_administrativo
spring.datasource.username=clinica
spring.datasource.password=${DB_PASSWORD:clinica123}

# O Flyway será responsável por criar as tabelas
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Conexão com o RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=clinica
spring.rabbitmq.password=${RABBITMQ_PASSWORD:clinica123}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Chaves JWT (ms-administrativo)
# As variáveis contêm apenas o caminho do arquivo, por exemplo C:/chaves/jwt-private.pem
jwt.chave-privada=file:${JWT_CHAVE_PRIVADA}
jwt.chave-publica=file:${JWT_CHAVE_PUBLICA}
