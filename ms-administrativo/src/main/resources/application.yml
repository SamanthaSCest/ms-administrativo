server:
  port: ${SERVER_PORT:8081}

# ${VARIAVEL:padrão} = usa a variável de ambiente se existir (Docker), senão o valor padrão (execução local)
spring:
  application:
    name: ms-administrativo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clinical_administrativo}
    username: ${DB_USER:clinical}
    password: ${DB_PASSWORD:clinical}
  jpa:
    open-in-view: false  # evita consultas lazy "escondidas" na camada web
    hibernate:
      ddl-auto: validate   # o schema é gerenciado pelo Flyway (db/migration)
  flyway:
    enabled: true
  # RabbitMQ: eventos da outbox (exchange adm.events)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:clinical}
    password: ${RABBITMQ_PASSWORD:clinical}
    publisher-confirm-type: correlated  # o RabbitMQ confirma cada mensagem recebida
    publisher-returns: true             # avisa quando nenhuma fila assina o evento
    template:
      mandatory: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    # Swagger UI exibe o contrato escrito à mão (fonte de verdade)
    url: /contract/openapi-administrativo.yaml
    path: /swagger-ui.html
    persist-authorization: true  # mantém o token do botão "Authorize" ao recarregar a página

# Autenticação (ver config/SecurityConfig). Em produção, SEMPRE defina as variáveis de ambiente.
seguranca:
  jwt:
    # Segredo HMAC (HS256) com no mínimo 32 caracteres
    segredo: ${JWT_SECRET:dev-only-troque-este-segredo-jwt-com-32+-caracteres}
    emissor: ms-administrativo
    expiracao: ${JWT_EXPIRACAO:2h}
  # Administrador criado na inicialização, se ainda não existir um usuário com este login
  admin:
    login: ${ADMIN_LOGIN:admin}
    senha: ${ADMIN_PASSWORD:admin12345}
  # Chave enviada no header X-Api-Key por outros microserviços (ex.: ms-agendamento). Vazia = desligado
  integracao:
    api-key: ${INTEGRACAO_API_KEY:dev-integracao-key}

# Níveis de log (TRACE < DEBUG < INFO < WARN < ERROR). Mude para DEBUG para ver mais detalhes
# do nosso código, ex.: LOGGING_LEVEL_BR_EDU_IMEPAC=DEBUG
logging:
  level:
    br.edu.imepac: INFO

# Publicador da outbox (desligado nos testes, que não sobem RabbitMQ)
outbox:
  publicador:
    habilitado: ${OUTBOX_PUBLICADOR_HABILITADO:true}
