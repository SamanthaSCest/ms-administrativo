server:
  port: ${SERVER_PORT:8081}

# ${VARIAVEL:padrão} = usa a variável de ambiente se existir (Docker), senão o valor padrão (execução local)
spring:
  application:
    name: ms-administrativo
  # Fora do Docker (IDE, mvn spring-boot:run), lê as credenciais do .env da raiz do repositório
  # (o diretório de trabalho pode ser o módulo ou a raiz, por isso os dois caminhos)
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clinical_administrativo}
    # Sem valor padrão: usuário e senha vêm do ambiente (DB_USER/DB_PASSWORD no Docker) ou do .env
    username: ${DB_USER:${ADMINISTRATIVO_DB_USER}}
    password: ${DB_PASSWORD:${ADMINISTRATIVO_DB_PASSWORD}}
  jpa:
    open-in-view: false  # evita consultas lazy "escondidas" na camada web
    hibernate:
      ddl-auto: validate   # o schema é gerenciado pelo Flyway (db/migration)
  flyway:
    enabled: true
  # RabbitMQ: eventos da outbox (exchange adm.events)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # Sem valor padrão: vêm do ambiente (Docker) ou do .env
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated  # o RabbitMQ confirma cada mensagem recebida
    publisher-returns: true             # avisa quando nenhuma fila assina o evento
    template:
      mandatory: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    # Swagger UI exibe o contrato escrito à mão (fonte de verdade)
    url: /contract/openapi-administrativo.yaml
    path: /swagger-ui.html
    persist-authorization: true  # mantém o token do botão "Authorize" ao recarregar a página
    # Botão "Authorize" faz login no Keycloak (authorization code + PKCE) com o client público clinical-web
    oauth:
      client-id: clinical-web
      use-pkce-with-authorization-code-grant: true

# Autenticação pelo Keycloak (ver config/SecurityConfig e keycloak/realm-clinical.json).
# Em produção, SEMPRE defina as variáveis de ambiente.
keycloak:
  # Endereço que ESTE serviço usa para falar com o Keycloak (chaves públicas e Admin API)
  url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:clinical}
  # Valor esperado no claim "iss": o endereço público do Keycloak (KC_HOSTNAME) + /realms/<realm>
  issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/clinical}
  # Client dono das roles de permissão; a service account dele cria os usuários pela Admin API
  client-id: ${KEYCLOAK_CLIENT_ID:ms-administrativo}
  # Sem valor padrão: KEYCLOAK_CLIENT_SECRET no Docker ou KEYCLOAK_ADMINISTRATIVO_SECRET do .env
  client-secret: ${KEYCLOAK_CLIENT_SECRET:${KEYCLOAK_ADMINISTRATIVO_SECRET}}

# Níveis de log (TRACE < DEBUG < INFO < WARN < ERROR). Mude para DEBUG para ver mais detalhes
# do nosso código, ex.: LOGGING_LEVEL_BR_EDU_IMEPAC=DEBUG
logging:
  level:
    br.edu.imepac: INFO

# Publicador da outbox (desligado nos testes, que não sobem RabbitMQ)
outbox:
  publicador:
    habilitado: ${OUTBOX_PUBLICADOR_HABILITADO:true}
