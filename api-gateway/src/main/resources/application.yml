server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # http://localhost:8080/administrativo/medicos  ->  ms-administrativo /medicos
        - id: ms-administrativo
          uri: ${ADMINISTRATIVO_URL:http://localhost:8081}
          predicates:
            - Path=/administrativo/**
          filters:
            - StripPrefix=1
        # http://localhost:8080/agendamento/consultas  ->  ms-agendamento /consultas
        - id: ms-agendamento
          uri: ${AGENDAMENTO_URL:http://localhost:8082}
          predicates:
            - Path=/agendamento/**
          filters:
            - StripPrefix=1

# Validação do token do Keycloak (ver config/SecurityConfig)
keycloak:
  # Chaves públicas do realm (endereço que o gateway alcança; no docker-compose, o interno)
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/clinical/protocol/openid-connect/certs}
  # Valor esperado no claim "iss": endereço público do Keycloak (KC_HOSTNAME) + /realms/<realm>
  issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/clinical}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
